apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bankapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: myk8s

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: my-service
                port:
                  number: 80
