apiVersion: apps/v1
kind: Deployment
metdata: 
 name: myapp1
spec:
  replicas: 3
  selector:
    app: myk8s
  template:
    matadata:
      labels:
        name: myk8s
spec:
  container:
    name: cont1
    image: narayanarao8790/k8ssecond:appimage
    ports: 80
      -containerPort: 80
   
  envFrom:
    configMapRef:
      name: mycm


  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m
      memory: "256Mi"

  livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5

